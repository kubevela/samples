# KubeVela definition module for the bucket demo: the DevKit bucket
# components and high-availability trait. ../definitions/ holds the CUE ones
# (bucket-aws-cue and high-availability).
#
# Version is derived from git tags.

apiVersion: core.oam.dev/v1beta1
kind: DefinitionModule
metadata:
  name: floci-buckets
spec:
  description: S3 and Cloud Storage bucket components, created by Crossplane in Floci and floci-gcp, and a high-availability trait, authored with DevKit
  maintainers:
    - name: platform-team
  minVelaVersion: v1.12.0-alpha.1
  categories:
    - storage
    - crossplane
